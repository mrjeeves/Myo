[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

# Binary and library are versioned together: the running `myo` binary and the
# self-update engine share one version so "current version" is unambiguous.
# Bump this single value to cut a release (the release workflow asserts the
# git tag matches it).
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrjeeves/Myo"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
# Decoding the WebView's base64-encoded mic captures back to audio bytes
# before handing them to the transcription engine.
base64 = "0.22"
dirs = "6"
# default-features off + rustls keeps the binary free of a system OpenSSL
# dependency, which matters for the 5-target release matrix.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Object-safe async methods on the `Tool` trait, so the native tool registry can
# hold `Arc<dyn Tool>` and dispatch a heterogeneous tool kit.
async-trait = "0.1"

[profile.release]
strip = true
lto = "thin"
