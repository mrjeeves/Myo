name: 💡 Idea / feature request
description: Suggest something for Myo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you trying to do? What's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: markdown
    attributes:
      value: "Tip: Myo's roadmap and vision live in [docs/PLAN.md](https://github.com/mrjeeves/Myo/blob/main/docs/PLAN.md) — your idea might already be on the map."
