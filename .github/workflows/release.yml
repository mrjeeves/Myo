name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux is pinned to 22.04 (glibc 2.35) so the binaries run on
          # 22.04+ / Debian 12 rather than only on the newest runner's glibc.
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-aarch64,  os: macos-14,         target: aarch64-apple-darwin }
          - { name: macos-x86_64,   os: macos-14,         target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      # The binary embeds CARGO_PKG_VERSION (the workspace version) at compile
      # time. If the tag and the manifest disagree, every install misreports
      # its version and self-update loops forever saying "update available."
      # The workspace [workspace.package] version is the single source of truth.
      - name: Verify tag matches workspace version
        shell: bash
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          GOT=$(grep -A5 '^\[workspace.package\]' Cargo.toml | awk -F'"' '/^version = /{print $2; exit}')
          if [[ "$GOT" != "$EXPECTED" ]]; then
            echo "::error::Cargo.toml workspace version is $GOT, expected $EXPECTED (tag $TAG). Bump [workspace.package] version."
            exit 1
          fi
          echo "Workspace version matches tag $TAG ($EXPECTED)."

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.os }}

      - name: Build
        run: cargo build --release --locked -p myo --target ${{ matrix.platform.target }}

      # Package a portable binary + a basename-scoped .sha256 sidecar. The
      # sidecar's filename column must be the bare basename (not dist-bin/...)
      # so self-update's verifier finds it; `cd dist-bin` before hashing
      # guarantees that.
      - name: Package
        shell: bash
        run: |
          set -e
          BIN=target/${{ matrix.platform.target }}/release/myo
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          if [[ ! -f "$BIN" ]]; then echo "::error::binary not found at $BIN"; exit 1; fi
          mkdir -p dist-bin
          NAME="myo-${{ matrix.platform.name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$BIN" "dist-bin/myo.exe"
            (cd dist-bin && 7z a "${NAME}.zip" myo.exe >/dev/null)
            (cd dist-bin && (sha256sum "${NAME}.zip" || shasum -a 256 "${NAME}.zip") > "${NAME}.zip.sha256")
          else
            cp "$BIN" "dist-bin/myo"
            tar -czf "dist-bin/${NAME}.tar.gz" -C dist-bin myo
            (cd dist-bin && (sha256sum "${NAME}.tar.gz" || shasum -a 256 "${NAME}.tar.gz") > "${NAME}.tar.gz.sha256")
          fi
          ls -la dist-bin

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # First job to publish creates the (non-draft) release; the rest
          # append their assets to it.
          draft: false
          prerelease: false
          files: |
            dist-bin/myo-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
