[package]
name = "myo-core"
description = "Myo orchestration core — engine clients, capability mapping, and the normalized intent stream. Tauri-agnostic and fully unit-tested."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
# Encode the engine's raw `/v1/audio/speech` WAV bytes into the base64
# `AudioReady` payload the WebView plays (the voice client, tts.rs).
base64.workspace = true
# multipart: Odysseus's /api/chat_stream is form-data, not JSON.
# stream: we read the SSE body chunk-by-chunk as it arrives.
reqwest = { workspace = true, features = ["multipart", "stream"] }
# The native tool loop runs tool calls concurrently (a JoinSet of tasks) and
# streams their progress back over an mpsc channel — both from tokio's `sync`/`rt`.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
async-trait.workspace = true
# Long-term memory's durable store: a single-file SQLite DB under `~/.myo`
# (roadmap Slice 2). `bundled` compiles SQLite in-tree so there's no system
# libsqlite3 dependency — the same self-contained stance as rustls for TLS.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# A throwaway loopback server for client integration tests (no external mocks).
tokio = { workspace = true, features = ["net", "io-util"] }
